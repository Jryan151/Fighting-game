This sets up the groundwork for a 3D polygon fighter reminiscent of the classic PS2 aesthetic you shared, complete with 3D perspective, lighting, a grid floor, and low-poly character meshes.

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Silicon Shadows - 3D Engine</title>
    <style>
        body {
            background-color: #0b0b16;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
            overflow: hidden;
            touch-action: none;
        }
        h1 {
            margin: 5px 0;
            font-size: 1.1rem;
            text-shadow: 0 0 8px #00ffcc;
            text-align: center;
        }
        #ui {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 360px;
            margin-bottom: 8px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .health-bar-container {
            width: 110px;
            height: 14px;
            border: 2px solid #00ffcc;
            background: #222;
            position: relative;
            margin-top: 2px;
        }
        .health-bar {
            height: 100%;
            background: #ff0055;
            width: 100%;
            transition: width 0.1s ease;
        }
        #playerHealth { background: #00ffcc; }
        #canvas-container {
            border: 3px solid #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
            width: 100%;
            max-width: 360px;
            height: 260px;
            background: #05050a;
        }
        #status {
            text-align: center;
            font-size: 0.9rem;
            height: 20px;
            margin: 5px 0;
            color: #00ffcc;
        }
        #controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 360px;
            margin-top: 15px;
        }
        .control-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
        .ctrl-btn {
            flex: 1;
            background: rgba(0, 255, 204, 0.1);
            border: 2px solid #00ffcc;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 16px 0;
            border-radius: 8px;
            text-align: center;
            user-select: none;
            -webkit-user-select: none;
        }
        .ctrl-btn:active {
            background: rgba(0, 255, 204, 0.4);
            box-shadow: 0 0 12px #00ffcc;
        }
        .action-btn {
            border-color: #ff0055;
            color: #ff0055;
            background: rgba(255, 0, 85, 0.1);
        }
        .action-btn:active {
            background: rgba(255, 0, 85, 0.4);
            box-shadow: 0 0 12px #ff0055;
        }
    </style>
    <!-- Load Three.js 3D Library from CDN -->
    <script src="[https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js](https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js)"></script>
</head>
<body>

    <h1>SILICON SHADOWS: 3D</h1>
    <div id="ui">
        <div>PLAYER: <span id="pText">100</span>%
            <div class="health-bar-container"><div id="playerHealth" class="health-bar"></div></div>
        </div>
        <div>AI RIVAL: <span id="aiText">100</span>%
            <div class="health-bar-container"><div id="aiHealth" class="health-bar"></div></div>
        </div>
    </div>

    <div id="status">3D ENGINE INITIALIZED</div>
    <div id="canvas-container"></div>

    <div id="controls">
        <div class="control-row">
            <div class="ctrl-btn" id="leftBtn">◀ MOVE LEFT</div>
            <div class="ctrl-btn" id="rightBtn">MOVE RIGHT ▶</div>
        </div>
        <div class="control-row">
            <div class="ctrl-btn action-btn" id="punchBtn">ATTACK</div>
        </div>
    </div>

<script>
// --- Three.js 3D Setup ---
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e0e1f);

const camera = new THREE.PerspectiveCamera(50, 360 / 260, 0.1, 1000);
camera.position.set(0, 2, 6);
camera.lookAt(0, 0.5, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(360, 260);
container.appendChild(renderer.domElement);

// Lighting (Giving it that classic 3D game shadow/lighting depth)
const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);

const directionalLight = new THREE.DirectionalLight(0x00ffcc, 1);
directionalLight.position.set(5, 10, 7);
scene.add(directionalLight);

// Retro Arena Grid Floor
const grid = new THREE.GridHelper(20, 20, 0x00ffcc, 0x1a1a3a);
grid.position.y = -1;
scene.add(grid);

// Create Low-Poly 3D Fighters (Placeholder 3D meshes)
const bodyGeometry = new THREE.BoxGeometry(0.8, 1.8, 0.5);

const playerMat = new THREE.MeshLambertMaterial({ color: 0x00ffcc });
const playerMesh = new THREE.Mesh(bodyGeometry, playerMat);
playerMesh.position.set(-1.2, 0, 0);
scene.add(playerMesh);

const aiMat = new THREE.MeshLambertMaterial({ color: 0xff0055 });
const aiMesh = new THREE.Mesh(bodyGeometry, aiMat);
aiMesh.position.set(1.2, 0, 0);
scene.add(aiMesh);

// Game Logic State
let playerHealth = 100;
let aiHealth = 100;
let gameOver = false;
const input = { left: false, right: false };

// Touch Bindings
function bindControl(id, key) {
    const btn = document.getElementById(id);
    btn.addEventListener("touchstart", e => { e.preventDefault(); input[key] = true; }, {passive: false});
    btn.addEventListener("touchend", e => { e.preventDefault(); input[key] = false; }, {passive: false});
    btn.addEventListener("mousedown", () => input[key] = true);
    btn.addEventListener("mouseup", () => input[key] = false);
}

bindControl("leftBtn", "left");
bindControl("rightBtn", "right");

document.getElementById("punchBtn").addEventListener("click", () => {
    if (gameOver) return;
    // Attack logic check distance
    if (Math.abs(playerMesh.position.x - aiMesh.position.x) < 2.0) {
        aiHealth -= 15;
        if (aiHealth < 0) aiHealth = 0;
        document.getElementById("aiHealth").style.width = aiHealth + "%";
        document.getElementById("aiText").innerText = aiHealth;
        
        // Visual hit punch kickback
        aiMesh.position.x += 0.4;
        
        if (aiHealth === 0) {
            gameOver = true;
            document.getElementById("status").innerText = "3D VICTORY: YOU WIN";
        }
    }
});

// Main Animation & Game Loop
function animate() {
    requestAnimationFrame(animate);

    if (!gameOver) {
        // Handle Movement in 3D Space
        if (input.left && playerMesh.position.x > -2.5) playerMesh.position.x -= 0.05;
        if (input.right && playerMesh.position.x < aiMesh.position.x - 0.8) playerMesh.position.x += 0.05;

        // Simple AI tracking
        if (aiMesh.position.x > playerMesh.position.x + 1.2) {
            aiMesh.position.x -= 0.015;
        }
    }

    renderer.render(scene, camera);
}

animate();
</script>

</body>
</html>
